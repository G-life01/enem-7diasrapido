<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Coleção ENEM 2026 | G-Ensino</title>
<meta name="description" content="Revise o ENEM 2026 inteiro em 7 ebooks de 10 páginas, com questões estilo ENEM e gabarito comentado. De R$ 59,99 por R$ 19,99.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@600;700;800&family=DM+Sans:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#F7F5FF; --ink:#1E1538; --soft:#625A7E; --card:#FFFFFF; --line:#E3DEF5;
  --brand:#5B2EFF; --brand-ink:#FFFFFF; --deep:#2A1A6E; --tint:#ECE6FF; --yel:#FFD84D; --go:#1FD17A; --go-ink:#0B2A1A;
  color-scheme:light;
  box-sizing:border-box; padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    color-scheme:dark;
    --bg:#120F2B; --ink:#F1EEFF; --soft:#B3ABD6; --card:#1E1A45; --line:#352F66;
    --brand:#8B6CFF; --brand-ink:#120F2B; --deep:#D7CCFF; --tint:#2A2459; --yel:#FFD84D;
  }
}
:root[data-theme="dark"]{
  color-scheme:dark;
  --bg:#120F2B; --ink:#F1EEFF; --soft:#B3ABD6; --card:#1E1A45; --line:#352F66;
  --brand:#8B6CFF; --brand-ink:#120F2B; --deep:#D7CCFF; --tint:#2A2459; --yel:#FFD84D;
}
html{scroll-padding-top:env(safe-area-inset-top,0px);height:100%}
*,*::before,*::after{box-sizing:inherit}
body{margin:0;min-height:100%;background:var(--bg);color:var(--ink);font-family:'DM Sans',system-ui,-apple-system,'Segoe UI',sans-serif;font-size:17px;line-height:1.55}
.wrap{max-width:480px;margin:0 auto;padding:20px 20px 48px}
h1,h2,h3{font-family:'Poppins',system-ui,sans-serif;font-weight:800;line-height:1.15;margin:0 0 12px;letter-spacing:-.02em}
h1{font-size:clamp(32px,9vw,42px)} h2{font-size:27px} h3{font-size:20px}
p{margin:0 0 14px}
.muted{color:var(--soft)}
.btn{display:block;width:100%;border:0;border-radius:14px;padding:17px 20px;font:700 17px 'DM Sans',system-ui,sans-serif;background:var(--brand);color:var(--brand-ink);cursor:pointer;text-align:center;text-decoration:none}
.btn:active{transform:scale(.99)}
.btn:focus-visible,.opt:focus-visible,.link:focus-visible{outline:3px solid var(--yel);outline-offset:3px}
.link{background:none;border:0;color:var(--soft);font:inherit;text-decoration:underline;cursor:pointer;padding:12px;width:100%}
.top{display:flex;align-items:center;gap:12px;margin-bottom:28px;min-height:28px}
.bar{flex:1;height:10px;background:var(--line);border-radius:99px;overflow:hidden}
.bar>i{display:block;height:100%;background:var(--brand);border-radius:99px;transition:width .35s ease}
.step{font-size:14px;color:var(--soft);white-space:nowrap}
.area{display:inline-block;font-size:13px;font-weight:700;color:var(--brand);background:var(--tint);border-radius:99px;padding:4px 12px;margin-bottom:12px}
.q{font-family:'Poppins',system-ui,sans-serif;font-size:23px;line-height:1.3;margin:0 0 22px;font-weight:700}
.opt{display:block;width:100%;text-align:left;background:var(--card);color:var(--ink);border:2px solid var(--line);border-radius:14px;padding:15px 16px;margin-bottom:10px;font:500 16px 'DM Sans',system-ui,sans-serif;cursor:pointer;transition:border-color .15s,background .15s}
.opt:hover{border-color:var(--brand)}
.opt.on{border-color:var(--brand);background:var(--tint)}
.card{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:22px}
.tag{display:inline-block;background:var(--tint);color:var(--deep);border-radius:99px;padding:5px 12px;font-size:14px;font-weight:700;margin-bottom:14px}
.micro{background:var(--tint);border-radius:14px;padding:14px 16px;margin-bottom:20px;font-size:15px}
.fine{font-size:13px;color:var(--soft);text-align:center;margin-top:12px}
dialog{border:0;border-radius:18px;padding:24px;max-width:380px;width:calc(100% - 40px);background:var(--card);color:var(--ink)}
dialog::backdrop{background:rgba(18,15,43,.7)}
.spin{width:44px;height:44px;border-radius:50%;border:5px solid var(--line);border-top-color:var(--brand);animation:sp 1s linear infinite;margin:40px auto 24px}
@keyframes sp{to{transform:rotate(360deg)}}
.calc-list{list-style:none;padding:0;margin:18px auto 0;max-width:300px;text-align:left}
.calc-list li{display:flex;gap:10px;align-items:center;padding:6px 0;color:var(--soft);opacity:0;animation:fadein .4s ease forwards}
.calc-list li:nth-child(1){animation-delay:.2s}.calc-list li:nth-child(2){animation-delay:.7s}.calc-list li:nth-child(3){animation-delay:1.2s}
.calc-list svg{color:var(--brand);flex:none}
@keyframes fadein{to{opacity:1}}

/* história com rolagem */
.story{position:relative;height:540vh}
.stage{position:sticky;top:0;height:100vh;height:100svh;display:flex;flex-direction:column;align-items:center;overflow:hidden}
.vis{width:100%;height:34vh;height:34svh;margin-top:7vh;margin-top:7svh;padding:0 30px;flex:none;display:flex;justify-content:center}
.vis svg{height:100%;width:auto;max-width:100%;overflow:visible}
.bub{fill:var(--card);stroke:var(--line);stroke-width:1.6;transition:fill .3s,stroke .3s}
.bub.f{fill:var(--brand);stroke:var(--brand)}
.stamp{opacity:0;transform-box:fill-box;transform-origin:center;transform:scale(.6) rotate(-12deg);transition:opacity .4s,transform .4s cubic-bezier(.2,1.4,.4,1)}
.stamp.on{opacity:1;transform:scale(1) rotate(-12deg)}
.chapters{position:relative;flex:1;width:100%;margin-top:5vh;margin-top:5svh}
.ch{position:absolute;left:0;right:0;top:0;text-align:center;opacity:0;visibility:hidden;will-change:opacity,transform;padding:0 4px}
.lead{font-family:'Poppins',system-ui,sans-serif;font-weight:800;font-size:clamp(25px,7vw,31px);line-height:1.2;letter-spacing:-.02em;margin:0 auto 18px;max-width:15em;text-wrap:balance;color:var(--ink)}
.lead .hl{background:linear-gradient(transparent 60%,var(--yel) 60%,var(--yel) 92%,transparent 92%);color:inherit}
:root[data-theme="dark"] .lead .hl{color:var(--ink)}
.ch .hint{display:flex;flex-direction:column;align-items:center;gap:6px;font-size:14px;color:var(--soft);margin-top:22px}
.ch .hint svg{animation:nudge 1.6s ease-in-out infinite}
@keyframes nudge{0%,100%{transform:translateY(0)}50%{transform:translateY(5px)}}
.ch .micro{max-width:25em;margin:0 auto 18px;text-align:center;font-size:15px;line-height:1.5}
.ch .btn{max-width:25em;margin:0 auto}
.ch .btn.buynow{background:var(--go);color:var(--go-ink);font-weight:800;animation:buypulse 2.2s ease-in-out infinite}
.ch .fine{max-width:25em;margin:12px auto 0}
.dots{position:absolute;right:0;top:50%;transform:translateY(-50%);display:flex;flex-direction:column;gap:9px;z-index:2}
.dots i{width:7px;height:7px;border-radius:50%;background:var(--line);transition:background .3s,transform .3s}
.dots i.on{background:var(--brand);transform:scale(1.35)}
.skip{position:absolute;top:calc(env(safe-area-inset-top,0px) + 8px);right:0;width:auto;font-size:14px;padding:8px 4px;z-index:2}
.brand{position:absolute;top:calc(env(safe-area-inset-top,0px) + 16px);left:0;font-family:'Poppins',sans-serif;font-weight:800;font-size:15px;color:var(--ink)}
.story.static{height:auto}
.story.static .stage{position:static;height:auto;overflow:visible}
.story.static .chapters{display:flex;flex-direction:column;gap:30px;margin-top:24px}
.story.static .ch{position:static;opacity:1!important;visibility:visible!important;transform:none!important}
.story.static .dots{display:none}
.enter{animation:enter .28s ease both}
@keyframes enter{from{opacity:0;transform:translateX(18px)}to{opacity:1;transform:none}}
.opt.on{animation:pop .22s ease}
@keyframes pop{50%{transform:scale(1.025)}}
.rv{opacity:0;transform:translateY(14px);transition:opacity .6s ease,transform .6s ease}
.rv.in{opacity:1;transform:none}

/* resultado */
.map{padding:24px 20px}
.map h3{font-size:22px;margin:4px 0 18px}
.gauge{margin-bottom:14px}
.g-top{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:7px;font-size:16px}
.g-top b{font-family:'Poppins',sans-serif;font-size:15px;color:var(--brand)}
.g-top b.low{color:#D9480F}
.seg{display:flex;gap:6px}
.seg i{flex:1;height:12px;border-radius:99px;background:var(--line)}
.seg i.f{background:var(--brand)}
.seg.low i.f{background:#F08C4B}
.insight{font-family:'Poppins',sans-serif;font-size:20px;line-height:1.3;font-weight:800;margin:20px 0 12px}
.tz{background:var(--tint);border-radius:14px;padding:16px;margin-bottom:16px}
.tz small{display:block;font-weight:700;color:var(--brand);font-size:13px;margin-bottom:6px}
.tz-t{margin:0;font-size:16px;line-height:1.55;max-height:6.2em;overflow:hidden;-webkit-mask-image:linear-gradient(#000 40%,transparent);mask-image:linear-gradient(#000 40%,transparent)}
.start{display:flex;gap:12px;align-items:center;background:var(--card);border:2px solid var(--brand);border-radius:16px;padding:14px;margin:18px 0 0}
.start img{width:64px;border-radius:6px;flex:none;box-shadow:0 4px 12px rgba(18,15,43,.2)}
.start small{display:block;color:var(--soft);font-size:13px}
.start b{font-family:'Poppins',sans-serif;font-size:17px;line-height:1.25}
.why{list-style:none;margin:16px 0 0;padding:0}
.why li{display:flex;gap:14px;align-items:flex-start;margin-bottom:16px}
.why .n{flex:none;width:34px;height:34px;border-radius:10px;background:var(--yel);color:#1E1538;font:800 16px 'Poppins',sans-serif;display:flex;align-items:center;justify-content:center}
.why b{display:block;font-family:'Poppins',sans-serif;font-size:18px;line-height:1.25;margin-bottom:4px}
.why p{margin:0;font-size:16px;color:var(--soft)}
.covers{display:flex;gap:8px;overflow-x:auto;margin:0 -22px 18px;padding:4px 22px 10px;scroll-snap-type:x mandatory}
.covers img{width:76px;flex:none;border-radius:6px;scroll-snap-align:start;box-shadow:0 6px 14px rgba(0,0,0,.3)}
.buy{background:linear-gradient(160deg,#2A1A6E 0%,#5B2EFF 100%);color:#fff;border:0;border-radius:20px;padding:26px 22px;text-align:center;overflow:hidden}
.buy h3{color:#fff;font-size:23px}
.buy .lead2{color:rgba(255,255,255,.85);margin:0 0 16px;font-size:16px}
.recv{list-style:none;margin:0 0 18px;padding:0;text-align:left}
.recv li{display:flex;gap:10px;padding:7px 0;font-size:16px;color:#fff}
.recv svg{flex:none;margin-top:4px;color:var(--yel)}
.from{font-size:15px;color:rgba(255,255,255,.8)}
.price{font-family:'Poppins',sans-serif;font-size:44px;font-weight:800;color:#fff;line-height:1.1;letter-spacing:-.02em}
.buy .fine{color:rgba(255,255,255,.8)}
.buy .btn{background:var(--go);color:var(--go-ink);font-weight:800;animation:buypulse 2.2s ease-in-out infinite}
@keyframes buypulse{0%,100%{box-shadow:0 0 0 0 rgba(31,209,122,0)}50%{box-shadow:0 0 0 8px rgba(31,209,122,.28)}}
.guar{display:flex;gap:12px;align-items:flex-start;background:rgba(255,255,255,.13);border-radius:14px;padding:14px 16px;margin-top:16px;font-size:14px;text-align:left;color:#fff}
.guar svg{flex:none;margin-top:2px;color:var(--yel)}
.stickybar{position:fixed;left:0;right:0;bottom:0;z-index:5;background:var(--card);border-top:1px solid var(--line);padding:10px 16px calc(10px + env(safe-area-inset-bottom,0px));transform:translateY(110%);transition:transform .3s ease}
.stickybar.show{transform:none}
.stickybar>div{max-width:480px;margin:0 auto;display:flex;gap:12px;align-items:center}
.stickybar .btn{padding:14px 16px;font-size:16px;background:var(--go);color:var(--go-ink)}
.stickybar small{display:block;color:var(--soft);font-size:13px;line-height:1.2;white-space:nowrap}
.stickybar small s{opacity:.8}
.stickybar b{font-family:'Poppins',sans-serif;font-size:20px;white-space:nowrap}
.center{text-align:center}
@media (prefers-reduced-motion:reduce){
  .spin,.ch .hint svg,.ch .btn.buynow,.buy .btn,.enter,.opt.on{animation:none}
  .bar>i,.bub,.stamp,.stickybar{transition:none}
  .rv{opacity:1;transform:none;transition:none}
  .calc-list li{animation:none;opacity:1}
}
</style>
</head>
<body>
<div class="wrap" id="app" aria-live="polite"></div>

<dialog id="dlg">
  <h3>Aqui entra o pagamento</h3>
  <p class="muted">Coloque o link do seu checkout na variável CHECKOUT_URL, no início do script desta página. Enquanto ele estiver vazio, este aviso aparece no lugar do pagamento.</p>
  <button class="btn" onclick="document.getElementById('dlg').close()">Entendi</button>
</dialog>

<script>
/* ====== CONFIGURAÇÃO ====== */
const CHECKOUT_URL = ''; // cole aqui o link do checkout (Hotmart, Kiwify, Eduzz...)
const PRICE = 'R$ 19,99', PRICE_FROM = 'R$ 59,99';

const app=document.getElementById('app');
const REDUCE=window.matchMedia('(prefers-reduced-motion: reduce)').matches;
const clamp=(x,a=0,b=1)=>Math.min(b,Math.max(a,x));
const check='<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12l5 5 9-10"/></svg>';
const shield='<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 3l8 3v6c0 5-3.5 8-8 9-4.5-1-8-4-8-9V6z"/><path d="M9 12l2 2 4-4"/></svg>';

/* ====== INTRO COM ROLAGEM ====== */
const CH_RANGES=[[0,.15],[.15,.32],[.32,.49],[.49,.66],[.66,.83],[.83,1.01]];
const MARKS=[1,3,0,4,2,1,3,2,0,4];
let storyOn=false, ticking=false;
function sheet(){
  let rows='';
  for(let r=0;r<10;r++){
    const col=r<5?0:1, row=r%5, x0=col?112:12, y=44+row*20;
    rows+=`<text x="${x0}" y="${y+4}" font-size="9" font-weight="700" fill="var(--soft)">${String(r+1).padStart(2,'0')}</text>`;
    for(let k=0;k<5;k++) rows+=`<circle class="bub" data-r="${r}" data-k="${k}" cx="${x0+22+k*14}" cy="${y}" r="5.2"/>`;
  }
  return `<svg viewBox="0 0 200 150" role="img" aria-label="Um cartão-resposta sendo preenchido conforme você rola a página">
    <rect x="2" y="2" width="196" height="146" rx="12" fill="var(--card)" stroke="var(--line)" stroke-width="2"/>
    <text x="14" y="22" font-size="10" font-weight="800" fill="var(--ink)" font-family="Poppins,sans-serif">CARTÃO-RESPOSTA</text>
    <text x="186" y="22" text-anchor="end" font-size="8" fill="var(--soft)">ENEM 2026</text>
    <line x1="14" y1="29" x2="186" y2="29" stroke="var(--line)"/>
    ${rows}
    <g class="stamp" id="stamp"><rect x="118" y="96" width="76" height="30" rx="6" fill="var(--yel)" stroke="#1E1538" stroke-width="2"/><text x="156" y="115" text-anchor="middle" font-size="10" font-weight="800" fill="#1E1538" font-family="Poppins,sans-serif">E VOCÊ?</text></g>
  </svg>`;
}
function intro(){
  stopStory();
  app.innerHTML=`
  <div class="story${REDUCE?' static':''}" id="story">
    <div class="stage">
      <span class="brand">G-Ensino</span>
      <button class="link skip" onclick="buy()">Comprar agora</button>
      <div class="dots" aria-hidden="true"><i class="on"></i><i></i><i></i><i></i><i></i><i></i></div>
      <div class="vis">${sheet()}</div>
      <div class="chapters">
        <div class="ch">
          <h1 class="lead">E se o que te trava no ENEM não for falta de estudo, mas <span class="hl">estudar as coisas erradas?</span></h1>
          <p class="hint">Role para baixo<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 9l6 6 6-6"/></svg></p>
        </div>
        <div class="ch"><p class="lead">Quantas vezes você abriu uma apostila de 400 páginas e fechou na página 3?</p></div>
        <div class="ch"><p class="lead">Você sabe quais conteúdos <span class="hl">caem todo ano</span> e quais quase nunca aparecem?</p></div>
        <div class="ch"><p class="lead">Na redação, você sabe o que zera e o que vale 200 pontos sozinho?</p></div>
        <div class="ch"><p class="lead">E se você soubesse exatamente <span class="hl">onde está perdendo pontos</span> antes do dia da prova?</p></div>
        <div class="ch">
          <h2 class="lead">Revise o ENEM 2026 inteiro em <span class="hl">7 ebooks de 10 páginas</span></h2>
          <p class="micro">Os conteúdos que mais caem em todas as áreas, com questões estilo ENEM e gabarito comentado. <b>De <s>${PRICE_FROM}</s> por ${PRICE}</b>, pagamento único.</p>
          <button class="btn buynow" onclick="buy()">Quero minha coleção agora</button>
          <p class="fine">7 dias de garantia · Acesso imediato em PDF<br>Material independente, sem vínculo com o Inep</p>
        </div>
      </div>
    </div>
  </div>`;
  window.scrollTo(0,0);
  if(REDUCE){ fillSheet(1); return; }
  storyOn=true;
  window.addEventListener('scroll',onScroll,{passive:true});
  window.addEventListener('resize',onScroll);
  update();
}
function stopStory(){ storyOn=false; window.removeEventListener('scroll',onScroll); window.removeEventListener('resize',onScroll); }
function onScroll(){ if(!ticking){ ticking=true; requestAnimationFrame(()=>{ticking=false;update();}); } }
function fillSheet(p){
  const n=Math.floor(clamp(p/.85)*10+.0001);
  document.querySelectorAll('.bub').forEach(b=>{ const r=+b.dataset.r, k=+b.dataset.k; b.classList.toggle('f', r<n && MARKS[r]===k); });
  const s=document.getElementById('stamp'); if(s) s.classList.toggle('on', p>=.86);
}
function update(){
  if(!storyOn) return;
  const st=document.getElementById('story'); if(!st) return;
  const r=st.getBoundingClientRect(), span=st.offsetHeight-window.innerHeight;
  const p=clamp(-r.top/span);
  fillSheet(p);
  const chs=st.querySelectorAll('.ch'), f=.05;
  chs.forEach((el,k)=>{
    const [a,b]=CH_RANGES[k];
    const fin=k===0?1:clamp((p-a)/f), fout=k===chs.length-1?1:clamp((b-p)/f), o=Math.min(fin,fout);
    el.style.opacity=o; el.style.visibility=o>.02?'visible':'hidden';
    el.style.transform=`translateY(${(1-fin)*14-(1-fout)*10}px)`;
  });
  const act=CH_RANGES.findIndex(([a,b])=>p>=a&&p<b);
  st.querySelectorAll('.dots i').forEach((d,k)=>d.classList.toggle('on',k===(act<0?CH_RANGES.length-1:act)));
}

/* ====== CHECKOUT ====== */
function buy(){ if(CHECKOUT_URL){ window.location.href=CHECKOUT_URL; } else { document.getElementById('dlg').showModal(); } }
intro();
</script>
</body>
</html>
